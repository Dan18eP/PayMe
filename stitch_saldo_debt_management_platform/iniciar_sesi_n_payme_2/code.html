<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PayMe! - Iniciar Sesión</title>

                        "on-error": "#ffffff",
                        "primary-container": "#0d5c63",
                        "on-tertiary-container": "#7fdc80",
                        "secondary-fixed": "#d5e3fc",
                        "error": "#ba1a1a",
                        "primary-fixed": "#abeef6",
                        "primary": "#004349",
                        "on-background": "#1a1c1e",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container": "#eeeef0",
                        "on-secondary-fixed": "#0d1c2e",
                        "inverse-surface": "#2f3133",
                        "surface-bright": "#f9f9fc",
                        "background": "#f9f9fc",
                        "inverse-on-surface": "#f0f0f3",
                        "secondary": "#515f74",

                    },
                    "borderRadius": {

                    },
                    "spacing": {

                        "base": "8px",

                        "kpi-value": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700"}]

                },
            },
        }

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9fc;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-background {
            background: linear-gradient(135deg, #004349 0%, #002023 100%);
        }
        .auth-card {
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.05), 0px 12px 24px rgba(0, 0, 0, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-md">
<!-- Auth Background Ambient Effect -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-primary opacity-5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[40%] h-[40%] bg-primary opacity-5 rounded-full blur-[120px]"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md">
<!-- Brand Header Section -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary mb-md shadow-lg">
<span class="material-symbols-outlined text-white text-[32px]" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">PayMe!</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs max-w-[280px] mx-auto">
                Gestiona tus cobranzas de forma profesional y organizada.
            </p>
</div>
<!-- Authentication Card -->
<div class="auth-card bg-surface-container-lowest border border-outline-variant rounded-xl p-lg md:p-xl transition-all duration-300">
<div class="mb-lg">
<h2 class="font-title-lg text-title-lg text-on-surface">Bienvenido a PayMe!</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Ingresa tus credenciales para continuar.</p>
</div>
<form class="space-y-md" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs uppercase tracking-wider" for="email">Correo Electrónico</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-md pl-12 pr-md font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="email" placeholder="nombre@empresa.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-end">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs uppercase tracking-wider" for="password">Contraseña</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-md pl-12 pr-md font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-base py-xs">
<input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant select-none cursor-pointer" for="remember">Recordar sesión en este dispositivo</label>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-primary-container text-white font-title-md text-title-md py-md rounded-lg shadow-md hover:shadow-lg transition-all active:scale-[0.98] flex items-center justify-center gap-base" type="submit">
<span>Iniciar Sesión</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Social/Alternative Login Divider -->
<div class="relative my-lg">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-md uppercase tracking-widest">
<span class="bg-surface-container-lowest px-md text-on-surface-variant font-label-md">O accede con</span>
</div>
</div>
<!-- SSO Options -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-base py-md px-md border border-outline-variant rounded-lg bg-surface hover:bg-surface-container-high transition-colors font-title-md text-title-md">
<div class="w-5 h-5 flex items-center justify-center">
<svg height="18" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
</div>
<span class="text-label-md">Google</span>
</button>
<button class="flex items-center justify-center gap-base py-md px-md border border-outline-variant rounded-lg bg-surface hover:bg-surface-container-high transition-colors font-title-md text-title-md">
<span class="material-symbols-outlined text-[20px] text-on-surface" data-icon="work">work</span>
<span class="text-label-md">SSO Empresa</span>
</button>
</div>
</div>
<!-- Footer Help -->
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                ¿No tienes una cuenta? 
                <a class="text-primary font-bold hover:underline transition-all" href="#">Empieza gratis ahora</a>
</p>
<div class="mt-xl flex justify-center gap-lg opacity-40 grayscale">
<span class="font-label-md text-label-md">Seguridad 256-bit</span>
<span class="font-label-md text-label-md">PCI Compliant</span>
</div>
</div>
</main>
<!-- Optional Visual Aesthetic: Floating Shapes for Premium Feel -->
<div class="absolute right-[5%] top-[15%] w-32 h-32 opacity-20 pointer-events-none hidden lg:block">
<div class="w-full h-full border border-primary rounded-full animate-[spin_10s_linear_infinite]"></div>
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-4 h-4 bg-primary rounded-full"></div>
</div>
<div class="absolute left-[10%] bottom-[10%] w-24 h-24 opacity-20 pointer-events-none hidden lg:block">
<div class="w-full h-full border border-primary rounded-lg rotate-45 animate-pulse"></div>
</div>
<script>
        // Micro-interaction for input focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple visibility toggle logic
        const toggleBtn = document.querySelector('[data-icon="visibility"]').parentElement;
        const passwordInput = document.getElementById('password');
        let isVisible = false;

        toggleBtn.addEventListener('click', () => {
            isVisible = !isVisible;
            passwordInput.type = isVisible ? 'text' : 'password';
            toggleBtn.querySelector('span').textContent = isVisible ? 'visibility_off' : 'visibility';
        });
    </script>
</body></html>
